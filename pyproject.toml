[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-dte-lab"
version = "0.6.0"
description = "Fail-closed 0DTE options research, streaming backtest and paper-trading prototype"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
parquet = ["duckdb>=1.1,<2"]
audit = ["pytest>=8,<10", "ruff>=0.7", "vulture>=2", "bandit>=1.7"]
all = ["duckdb>=1.1,<2", "pytest>=8,<10", "ruff>=0.7", "vulture>=2", "bandit>=1.7"]

[project.scripts]
zerodte = "zerodte.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
exclude = ["data", "results", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
